version: 2

project_name: tchori

before:
  hooks:
    - go mod tidy

builds:
  - id: tchori
    main: ./cmd/tchori
    binary: tchori
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/tchori-labs/tchori/internal/version.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: tchori
    ids: [tchori]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

# Releases belong to the public product, never the private history archive.
# The workflow also gates jobs on the public repository identity.
release:
  github:
    owner: tchori-labs
    name: tchori
  # Keep assets private until the workflow has validated and attested them.
  # A retry safely replaces an incomplete draft left by a failed run.
  draft: true
  replace_existing_draft: true

checksum:
  name_template: "checksums.txt"

sboms:
  - id: archives
    artifacts: archive
    disable: false

signs:
  - id: checksums
    artifacts: checksum
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - --yes
    output: true

changelog:
  disable: true
