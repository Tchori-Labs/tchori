name: Registry smoke

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  registry-smoke:
    name: live registry smoke
    runs-on: ubuntu-latest
    # Live registry and provider downloads are bounded against upstream stalls.
    timeout-minutes: 20
    steps:
      # Coordination: immutable pins match the versions tracked by TC-001.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: live registry install and protocol negotiation smoke
        run: go test -tags smoke ./e2e -v
